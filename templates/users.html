{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<h2>System Users</h2>
<div class="card">
  <table><tr><th>#</th><th>Name</th><th>Username</th><th>Phone</th><th>Role</th></tr>
  {% for u in users %}<tr><td>{{ u['id'] }}</td><td>{{ u['name'] }}</td><td>{{ u['username'] }}</td><td>{{ u['phone'] or '' }}</td><td>{{ u['role'] }}</td></tr>{% endfor %}</table>
</div>
{% endblock %}
