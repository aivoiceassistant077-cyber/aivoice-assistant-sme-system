{% extends "base.html" %}
{% block title %}Customers{% endblock %}
{% block content %}
<h2>Customers</h2>
<div class="card">
  <form method="post" class="inline-form">
    <input name="name" placeholder="Customer name" required>
    <input name="phone" placeholder="Phone number">
    <button class="btn">Register customer</button>
  </form>
</div>
<div class="card">
  <table>
    <tr><th>#</th><th>Name</th><th>Phone</th><th>Registered</th></tr>
    {% for c in customers %}<tr><td>{{ c['id'] }}</td><td>{{ c['name'] }}</td><td>{{ c['phone'] or '' }}</td><td>{{ c['created_at'] }}</td></tr>
    {% else %}<tr><td colspan="4" class="muted">No customers yet.</td></tr>{% endfor %}
  </table>
</div>
{% endblock %}
