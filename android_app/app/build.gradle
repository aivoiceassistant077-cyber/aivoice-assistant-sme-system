plugins {
    id 'com.android.application'
}

android {
    namespace 'edu.ipam.group10.voiceassistant'
    compileSdk 34

    defaultConfig {
        applicationId "edu.ipam.group10.voiceassistant"
        minSdk 29            // Android 10 or higher (as stated in the proposal)
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No extra libraries are needed: the app uses the built-in Android WebView.
}
